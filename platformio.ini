; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; plain `pio run` / `pio run -t upload` builds the main firmware only
default_envs = uno

; Full firmware: calibration, stats, serial commands (src/main.cpp).
; debug_main.cpp is a separate program with its own setup()/loop(), so it
; is left out of this build.
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<debug_main.cpp>

; Hardware debug program (src/debug_main.cpp): streams power and raw ADC
; min/max, and drives the servo from a fixed threshold. Uses the same
; envelope module as the full firmware, but not main.cpp.
;   pio run -e debug -t upload
[env:debug]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = Servo
build_src_filter = +<*> -<main.cpp>

; Day-1 reference sketch (simple.ino in the repo root), built on its own:
;   pio run -e simple -t upload
[env:simple]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/simple_env.py
